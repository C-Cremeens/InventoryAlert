name: Database migrations
# Applies committed Prisma migrations to the database the triggering branch maps to (#91).
# Manual entry point; deploy.yml (#92) runs the same steps (.github/actions/migrate) during releases.
# Fails closed on any identity mismatch. See docs/database-migrations.md.
on:
  workflow_dispatch:
    inputs:
      backup-verified:
        description: Production only. I verified the backup/restore check for this release.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      # The target comes only from the trusted Git branch, never from an input.
      - id: map
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/dev) echo "environment=DEV" ;;
            refs/heads/uat) echo "environment=UAT" ;;
            refs/heads/main) echo "environment=PROD" ;;
            *) echo "::error::$REF has no migration target. Run from dev, uat or main."; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

  migrate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve.outputs.environment }}
    # Shares the release lock with deploy.yml: one release or migration per environment at a
    # time. A running one is never cancelled; a newer queued run replaces an older queued one.
    concurrency:
      group: release-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Require production backup confirmation
        if: needs.resolve.outputs.environment == 'PROD' && !inputs.backup-verified
        run: |
          echo "::error::Production migrations need backup-verified=true after completing the backup/restore check."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: ./.github/actions/migrate
        with:
          environment: ${{ needs.resolve.outputs.environment }}
          app-env: ${{ vars.APP_ENV }}
          neon-project-id: ${{ vars.NEON_PROJECT_ID }}
          neon-branch-id: ${{ vars.NEON_BRANCH_ID }}
          neon-endpoint-id: ${{ vars.NEON_ENDPOINT_ID }}
          migration-database-url: ${{ secrets.MIGRATION_DATABASE_URL }}
          neon-api-key: ${{ secrets.NEON_API_KEY }}
