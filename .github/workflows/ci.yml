name: CI
on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
# Untrusted PR code runs here: read-only token, no deployment secrets, never pull_request_target.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventoryalert_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the upgrade rehearsal can read origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Rehearse complete migration history
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventoryalert_test
      - name: Rehearse upgrade from the production release (main)
        run: |
          node -e "const c=new (require('pg').Client)(process.env.ADMIN_URL);c.connect().then(()=>c.query('CREATE DATABASE inventoryalert_upgrade')).then(()=>c.end())"
          node scripts/rehearse-upgrade.mjs
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventoryalert_upgrade
          BASE_REF: origin/main
      - name: Unit and PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventoryalert_test
      # No runtime secrets: building must remain safe for previews and CI.
      - name: Build
        run: npm run build
